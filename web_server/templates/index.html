<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <h1>Todo App</h1>

        <img
            id="random-image"
            src="/image"
            alt="Random picture from Lorem Picsum"
        >

        <footer>
            DevOps with Kubernetes 2026
        </footer>
    </main>

    <script>
        // Recheck the image every minute.
        // The Python backend only downloads when expired.
        setInterval(() => {
            const image = document.getElementById("random-image");

            image.src = "/image?t=" + Date.now();
        }, 60 * 1000);
    </script>
</body>
</html>
