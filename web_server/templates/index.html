

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main class="container">
        <h1>Todo App</h1>

        <img
            id="random-image"
            src="/image"
            alt="Random picture from Lorem Picsum"
        >

        <section class="todo-section">
            <div class="todo-form">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Enter a new todo (max 140 characters)"
                    maxlength="140"
                    aria-label="New todo"
                >

                <button type="button" id="send-button">
                    Send
                </button>
            </div>

            <h2>Todos</h2>

            <ul class="todo-list">
                <li>Learn Kubernetes basics</li>
                <li>Deploy application to cluster</li>
                <li>Configure persistent volumes</li>
            </ul>
        </section>

        <footer>
            DevOps with Kubernetes 2026
        </footer>
    </main>

    <script>
        // Refresh the displayed image every minute.
        // The backend handles the 10-minute cache.
        setInterval(() => {
            const image = document.getElementById("random-image");
            image.src = "/image?t=" + Date.now();
        }, 60 * 1000);
    </script>
</body>
</html>
