apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-app-pv
          persistentVolumeClaim:
            claimName: todo-pvc
      containers:
        - name: todo-app
          image: hexa4d/todo-app:2.2
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: todo-app-pv
              mountPath: /app/cache
          env:
            - name: PORT
              value: "3000"

