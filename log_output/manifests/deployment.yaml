apiVersion: apps/v1
kind: Deployment
metadata:
  name: logoutput-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      volumes:
        - name: shared-log-file
          persistentVolumeClaim:
            claimName: test-pv-claim
      containers:
        - name: logoutput
          image: hexa4d/log_output:1.11
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-log-file
              mountPath: /app/shared
