apiVersion: apps/v1
kind: Deployment
metadata:
  name: logoutput-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      containers:
        - name: logoutput
          image: hexa4d/log_output:2.5
          imagePullPolicy: Always
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name:  log-configmap
                  key: message
          volumeMounts:
            - name: config
              mountPath: /app/shared
              readOnly: True
      volumes:
        - name: config
          configMap:
            name: log-configmap
            items:
              - key: "information.txt"
                path: "information.txt"
