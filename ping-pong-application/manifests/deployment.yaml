apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: shared-log-file
          persistentVolumeClaim:
            claimName: test-pv-claim
      containers:
        - name: pingpong
          image: hexa4d/ping-pong:1.11
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-log-file
              mountPath: /app/shared
