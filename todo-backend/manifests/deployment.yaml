apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      volumes:
        - name: todo-backend-pv
          persistentVolumeClaim:
            claimName: todo-pvc
      containers:
        - name: todo-backend
          image: hexa4d/todo-backend:2.6
          volumeMounts:
            - name: todo-backend-pv
              mountPath: /app/cache
          envFrom:
            - configMapRef:
                name: todo-backend-configmap
