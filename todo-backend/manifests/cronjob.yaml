apiVersion: batch/v1
kind: CronJob
metadata:
  name: random-todo-job
  namespace: project
spec:
  schedule: "0 * * * *" # every hour at minute 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: todo-job
            image: hexa4d/todo-job:2.9
            env:
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: database-credentials
                    key: DATABASE_URL
              - name: MAX_TODO_LENGTH
                valueFrom:
                  configMapKeyRef:
                    name: todo-backend-configmap
                    key: MAX_TODO_LENGTH
          restartPolicy: OnFailure
